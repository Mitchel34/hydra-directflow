[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-directflow"
version = "0.1.0"
description = "Auditable direct hourly streamflow forecasting research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["numpy==2.3.3", "pyarrow==21.0.0", "numcodecs==0.16.3"]
models = ["torch==2.8.0", "transformers==4.55.4", "psutil==7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

