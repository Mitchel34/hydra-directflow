  <g id="text_14">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #657d86" transform="translate(10.8 370.906188)">Signed SSE differences use each lead’s original annual SST denominator; disjoint selected windows + remainder exactly reconstruct the annual gap.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #657d86" transform="translate(10.8 382.104)">Positive favors NWM; negative favors HYDRA. This is error accounting, not causal attribution. Diamond/range retain all three seeds; no confidence interval.</text>
  </g>
