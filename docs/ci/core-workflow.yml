name: Core contracts and local-data readers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[data]'
      - run: python -m unittest discover -s tests -p test_contracts.py -v
      - run: python -m unittest discover -s tests -p test_local_data.py -v
      - run: python -m unittest discover -s tests -p test_telemetry.py -v
      - run: python scripts/publication_check.py
